[project]
name = "lpdf"
version = "0.1.0"
description = "Python adapter for the lpdf PDF rendering engine"
requires-python = ">=3.8"
license = {text = "AGPL-3.0-or-later OR LicenseRef-Commercial"}

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["lpdf/**", "resources/**"]
