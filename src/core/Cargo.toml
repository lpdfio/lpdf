[package]
name = "lpdf"
version = "0.0.0"
edition = "2024"
description = "lpdf — PDF layout engine (WASM)"
repository = "https://github.com/codesensedev/lpdf"
license = "AGPL-3.0-or-later OR LicenseRef-Commercial"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
roxmltree = "0.20"
# PDF content stream generation — low-level, no_std-compatible, used by Typst
pdf-writer = "0.12"
# TTF glyph advance measurement — used for text alignment (center/right)
ttf-parser = "0.25"
# Font subsetting — embed only the glyphs actually used, keeps PDF size small
subsetter = "0.2"
