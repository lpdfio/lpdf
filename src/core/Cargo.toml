[package]
name = "lpdf"
version = "0.0.0"
edition = "2024"
description = "lpdf — PDF layout engine (WASM)"
repository = "https://github.com/lpdfio/lpdf"
license-file = "LICENSE"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
roxmltree = "0.20"
# PDF content stream generation — low-level, no_std-compatible, used by Typst
pdf-writer = "0.12"
# TTF glyph advance measurement — used for text alignment (center/right)
ttf-parser = "0.25"
# Font subsetting — embed only the glyphs actually used, keeps PDF size small
subsetter = "0.2"
# License token verification — Ed25519 signature check (verification only, no keygen)
ed25519-dalek = { version = "2", default-features = false, features = ["alloc"] }
# Base64url decoding for license token payload and signature segments
base64 = "0.22"
# Deflate/inflate for PNG RGBA decoding (SMask support)
miniz_oxide = "0.7"
# QR code generation (vector, no image crate dependency)
qrcode = { version = "0.14", default-features = false }
# MD5 for RC4-128 PDF encryption key derivation — WASM-compatible, no_std
md-5 = "0.10"

[dev-dependencies]
sha2 = "0.10"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name    = "pipeline"
harness = false

[[bench]]
name    = "images"
harness = false

[[bench]]
name    = "fonts"
harness = false

[[bin]]
name              = "gen_fixtures"
path              = "src/bin/gen_fixtures.rs"
required-features = []
