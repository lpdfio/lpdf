[package]
name = "lpdf"
version = "0.0.0"
edition = "2024"
description = "lpdf — PDF layout engine (WASM)"
repository = "https://github.com/lpdfio/lpdf"
license-file = "LICENSE"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
# unbounded_depth: a document tree nests deeper than serde_json's own limit, and `nesting.rs` bounds it instead
serde_json = { version = "1", features = ["unbounded_depth"] }
serde = { version = "1", features = ["derive"] }
roxmltree = "0.20"
# PDF content stream generation — low-level, no_std-compatible, used by Typst
pdf-writer = "0.12"
# TTF glyph advance measurement — used for text alignment (center/right)
ttf-parser = "0.25"
# Font subsetting — embed only the glyphs actually used, keeps PDF size small
subsetter = "0.2"
# License token verification — Ed25519 signature check (verification only, no keygen)
ed25519-dalek = { version = "2", default-features = false, features = ["alloc"] }
# Base64url decoding for license token payload and signature segments
base64 = "0.22"
# Deflate/inflate for PNG RGBA decoding (SMask support)
miniz_oxide = "0.7"
# QR code generation (vector, no image crate dependency)
qrcode = { version = "0.14", default-features = false }
# MD5 for RC4-128 PDF encryption key derivation — WASM-compatible, no_std
md-5 = "0.10"
# AES-256-CBC and SHA-2 for AES-256 PDF encryption (V=5 R=6) — WASM-compatible, no_std
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
sha2 = "0.10"
# Markdown parser for <markdown> — pure Rust, no I/O, builds for WASM and WASI with default features off
pulldown-cmark = { version = "0.13", default-features = false }
# PDF reader for `stamp` — default features off drop rayon and chrono
lopdf = { version = "0.46", default-features = false }
# Image decoders for WebP, GIF and TIFF, from image-rs. GIF's and TIFF's LZW (weezl) and TIFF's Deflate (flate2) come
# with lopdf already. TIFF's JPEG compression is left out: it would bring a JPEG decoder of its own
image-webp = "0.2"
gif = { version = "0.14", default-features = false, features = ["std"] }
tiff = { version = "0.11", default-features = false, features = ["lzw", "deflate", "fax"] }

# The JS build has no OS random source: lopdf's getrandom takes the browser's and Node's `crypto.getRandomValues`
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
lopdf = { version = "0.46", default-features = false, features = ["wasm_js"] }

[build-dependencies]
sha2 = "0.10"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name    = "pipeline"
harness = false

[[bench]]
name    = "images"
harness = false

[[bench]]
name    = "fonts"
harness = false

[[bin]]
name              = "gen_fixtures"
path              = "src/bin/gen_fixtures.rs"
required-features = []

[[bin]]
name = "codegen"
path = "src/bin/codegen.rs"
