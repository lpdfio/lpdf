[package]
name = "lpdf-wasi"
version = "0.0.0"
edition = "2024"
description = "lpdf — WASI binary entrypoint (all adapters)"
repository = "https://github.com/lpdfio/lpdf"
license-file = "../core/LICENSE"

[[bin]]
name = "lpdf-wasi"

[dependencies]
serde_json = "1"
serde     = { version = "1", features = ["derive"] }
roxmltree = "0.20"
# PDF rendering — same versions as core/Cargo.toml
pdf-writer = "0.12"
ttf-parser = "0.25"
subsetter   = "0.2"
# Base64 encoding for binary PDF bytes in the JSON envelope
base64 = "0.22"
# License token verification — Ed25519 signature check
ed25519-dalek = { version = "2", default-features = false, features = ["alloc"] }
# Deflate/inflate for PNG RGBA decoding (SMask support)
miniz_oxide = "0.7"
qrcode = { version = "0.14", default-features = false }
# MD5 for RC4-128 PDF encryption key derivation — WASM-compatible, no_std
md-5 = "0.10"
