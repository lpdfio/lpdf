<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>lpdf — Live Example 1</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy:      #0f2044;
      --navy-mid:  #1a3460;
      --blue:      #1763cf;
      --surface:   #ffffff;
      --bg:        #f7f8fc;
      --border:    #e2e6f0;
      --text:      #1a1a1a;
      --muted:     #64748b;
      --editor-bg: #0d1b35;
      --editor-fg: #c9d9f0;
    }

    html, body { height: 100%; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                   "Helvetica Neue", Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
    }

    /* ── App shell ──────────────────────────────────────────── */
    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* ── Header ─────────────────────────────────────────────── */
    header {
      height: 52px;
      background: var(--navy);
      color: #fff;
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 12px;
      flex-shrink: 0;
    }
    header a {
      color: #7aa7e0;
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
    }
    header a:hover { color: #fff; }
    .header-sep   { color: #2d4a70; }
    .header-title { font-size: 14px; font-weight: 600; }
    .header-badge {
      margin-left: auto;
      font-size: 11px;
      background: rgba(255,255,255,.09);
      border: 1px solid rgba(255,255,255,.16);
      color: #9ab7e0;
      padding: 3px 10px;
      border-radius: 20px;
      letter-spacing: .04em;
      font-weight: 500;
    }

    /* ── Split panes ─────────────────────────────────────────── */
    .panes {
      display: flex;
      flex: 1;
      min-height: 0;
    }

    /* ── Editor pane ─────────────────────────────────────────── */
    .pane-editor {
      display: flex;
      flex-direction: column;
      width: 50%;
      min-width: 0;
      border-right: 1px solid #1a304d;
    }

    .pane-label {
      padding: 7px 14px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .07em;
      text-transform: uppercase;
      flex-shrink: 0;
    }
    .pane-editor .pane-label {
      background: #0a1628;
      color: #4d7ab5;
      border-bottom: 1px solid #1a304d;
    }

    .editor-toolbar {
      background: #0d1f3c;
      border-bottom: 1px solid #1a304d;
      padding: 4px 10px;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .editor-toolbar label {
      font-size: 11px;
      color: #4d7ab5;
      font-weight: 600;
      white-space: nowrap;
    }
    .example-select {
      flex: 1;
      min-width: 0;
      background: #0a1628;
      color: #c9d9f0;
      border: 1px solid #1a304d;
      border-radius: 3px;
      font-size: 11px;
      padding: 2px 6px;
      cursor: pointer;
      outline: none;
    }
    .example-select:focus { border-color: #1763cf; }

    textarea {
      flex: 1;
      resize: none;
      border: none;
      outline: none;
      background: var(--editor-bg);
      color: var(--editor-fg);
      font-family: "Cascadia Code", "Fira Code", "JetBrains Mono", Consolas, monospace;
      font-size: 12.5px;
      line-height: 1.7;
      padding: 14px;
      tab-size: 2;
      white-space: pre-wrap;
      overflow: auto;
      caret-color: #5fa3ff;
    }

    .editor-foot {
      padding: 5px 14px;
      background: #0a1628;
      border-top: 1px solid #1a304d;
      flex-shrink: 0;
      min-height: 36px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-render {
      margin-left: auto;
      padding: 4px 13px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .04em;
      background: #1763cf;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background .15s;
      flex-shrink: 0;
    }
    .btn-render:hover:not(:disabled) { background: #124fa8; }
    .btn-render:disabled { opacity: .45; cursor: default; }
    .status-idle    { font-size: 11px; color: #4d7ab5; }
    .status-loading { font-size: 11px; color: #9ab7e0; }
    .status-ok      { font-size: 11px; color: #4caf7d; }
    .status-error   { font-size: 11px; color: #e05b5b; word-break: break-all; }

    .spinner {
      display: inline-block;
      width: 9px; height: 9px;
      border: 2px solid #1a304d;
      border-top-color: #9ab7e0;
      border-radius: 50%;
      animation: spin .65s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Preview pane ────────────────────────────────────────── */
    .pane-preview {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-width: 0;
    }
    .pane-preview .pane-label {
      background: #f0f4fb;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
    }

    .preview-inner {
      flex: 1;
      position: relative;
      background: #cdd3de;
    }

    /* ── Preview toolbar ──────────────────────────────────── */
    .preview-toolbar {
      background: #e8ecf4;
      border-bottom: 1px solid var(--border);
      padding: 4px 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      flex-shrink: 0;
    }
    .btn-zoom {
      width: 24px; height: 22px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 3px;
      cursor: pointer;
      font-size: 15px;
      line-height: 1;
      color: var(--muted);
      display: flex; align-items: center; justify-content: center;
      padding: 0;
      transition: background .1s;
    }
    .btn-zoom:hover:not(:disabled) { background: #dce8f9; color: var(--text); }
    .btn-zoom:disabled { opacity: .4; cursor: default; }
    .zoom-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      min-width: 40px;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }
    .btn-zoom-fit {
      margin-left: 2px;
      padding: 2px 8px;
      font-size: 11px;
      font-weight: 600;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 3px;
      cursor: pointer;
      color: var(--muted);
      transition: background .1s;
    }
    .btn-zoom-fit:hover:not(:disabled) { background: #dce8f9; color: var(--text); }
    .btn-zoom-fit:disabled { opacity: .4; cursor: default; }
    .toolbar-sep {
      width: 1px;
      height: 16px;
      background: var(--border);
      margin: 0 4px;
    }
    .pdf-size {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    .btn-download {
      padding: 2px 9px;
      font-size: 11px;
      font-weight: 600;
      background: #1763cf;
      color: #fff;
      border: none;
      border-radius: 3px;
      cursor: pointer;
      transition: background .1s;
    }
    .btn-download:hover:not(:disabled) { background: #124fa8; }
    .btn-download:disabled { opacity: .4; cursor: default; }

    .preview-pages {
      position: absolute;
      inset: 0;
      overflow: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .preview-pages canvas {
      display: block;
      margin: 0 auto;
      box-shadow: 0 2px 10px rgba(0,0,0,.45);
      flex-shrink: 0;
    }

    .preview-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #8896aa;
      font-size: 13px;
      gap: 10px;
      pointer-events: none;
      user-select: none;
    }
    .placeholder-icon {
      font-size: 36px;
      opacity: .35;
      line-height: 1;
    }
  </style>
</head>
<body>

<div class="app">

  <header>
    <a href="index.html">← lpdf</a>
    <span class="header-sep">/</span>
    <span class="header-title">Example 1 — Live Editor</span>
    <span class="header-badge">Browser · WASM</span>
  </header>

  <div class="panes">

    <!-- ── Left: XML editor ─────────────────────────────────── -->
    <div class="pane-editor">
      <div class="pane-label">XML Source</div>
      <div class="editor-toolbar">
        <label for="example-select">Example:</label>
        <select id="example-select" class="example-select">
        </select>
      </div>
      <textarea id="editor" spellcheck="false"
                autocorrect="off" autocapitalize="off"
                aria-label="lpdf XML source"></textarea>
      <div class="editor-foot">
        <div id="status">
          <span class="spinner"></span>
          <span class="status-loading">loading engine…</span>
        </div>
        <button id="btn-render" class="btn-render" disabled>Render</button>
      </div>
    </div>

    <!-- ── Right: PDF preview ───────────────────────────────── -->
    <div class="pane-preview">
      <div class="pane-label">PDF Preview</div>
      <div class="preview-toolbar">
        <button id="btn-zoom-out" class="btn-zoom" disabled title="Zoom out">−</button>
        <span id="zoom-label" class="zoom-label">—</span>
        <button id="btn-zoom-in" class="btn-zoom" disabled title="Zoom in">+</button>
        <button id="btn-zoom-fit" class="btn-zoom-fit" disabled title="Fit to pane">Fit</button>
        <span class="toolbar-sep"></span>
        <span id="pdf-size" class="pdf-size"></span>
        <button id="btn-download" class="btn-download" disabled title="Download PDF">↓ Download</button>
      </div>
      <div class="preview-inner">
        <div class="preview-placeholder" id="placeholder">
          <span class="placeholder-icon">⬚</span>
          <span>PDF preview will appear here</span>
        </div>
        <div id="preview-pages" class="preview-pages"></div>
      </div>
    </div>

  </div>
</div>

<script type="module">
  import { initLpdf } from '../../src/adapters/node/dist/browser.js';
  import * as pdfjsLib from 'https://cdn.jsdelivr.net/npm/pdfjs-dist@5.6.205/build/pdf.min.mjs';
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdn.jsdelivr.net/npm/pdfjs-dist@5.6.205/build/pdf.worker.min.mjs';

  // ── DOM refs ─────────────────────────────────────────────────────────────── ───────────────────────────────────────────────────────────────
  const editor      = document.getElementById('editor');
  const statusEl    = document.getElementById('status');
  const btnRender   = document.getElementById('btn-render');
  const pagesEl     = document.getElementById('preview-pages');
  const placeholder = document.getElementById('placeholder');
  const btnZoomIn   = document.getElementById('btn-zoom-in');
  const btnZoomOut  = document.getElementById('btn-zoom-out');
  const btnZoomFit  = document.getElementById('btn-zoom-fit');
  const zoomLabelEl = document.getElementById('zoom-label');
  const btnDownload = document.getElementById('btn-download');
  const pdfSizeEl   = document.getElementById('pdf-size');
  const exampleSelect = document.getElementById('example-select');

  // ── Example files ──────────────────────────────────────────────────────────
  const EXAMPLES = [
    { label: 'Example 1 — Title + paragraphs',  file: 'examples/example1.xml' },
    { label: 'Example 2 — Résumé / CV',          file: 'examples/example2.xml' },
    { label: 'Example 3 — Invoice',              file: 'examples/example3.xml' },
    { label: 'Example 4 — Certificate',          file: 'examples/example4.xml' },
    { label: 'Example 5 — Event ticket',         file: 'examples/example5.xml' },
    { label: 'Example 6 — Business card',        file: 'examples/example6.xml' },
    { label: 'Example 7 — Shipping label',       file: 'examples/example7.xml' },
    { label: 'Example 8 — Product Overview',     file: 'examples/example8.xml' },
    { label: 'Example 9 — Auto-pagination',      file: 'examples/example9.xml' },
    { label: 'Example 10 — Header + page numbers', file: 'examples/example10.xml' },
    { label: 'Example 11 — Letterhead + running chrome', file: 'examples/example11.xml' },
    { label: 'Showcase - Stack',   file: 'examples/showcase-stack.xml' },
    { label: 'Showcase - Cluster', file: 'examples/showcase-cluster.xml' },
    { label: 'Showcase - Flank',   file: 'examples/showcase-flank.xml' },
    { label: 'Showcase - Split',   file: 'examples/showcase-split.xml' },
    { label: 'Showcase - Grid',    file: 'examples/showcase-grid.xml' },
    { label: 'Showcase - Frame',   file: 'examples/showcase-frame.xml' },
  ];

  EXAMPLES.forEach(({ label, file }, i) => {
    const opt = document.createElement('option');
    opt.value = file;
    opt.textContent = label;
    exampleSelect.appendChild(opt);
  });

  exampleSelect.addEventListener('change', async () => {
    const file = exampleSelect.value;
    if (!file) return;
    try {
      const res = await fetch(file);
      if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
      editor.value = await res.text();
      schedule();
    } catch (err) {
      setStatus('error', `Failed to load example: ${err.message}`);
    }
  });

  // ── State ──────────────────────────────────────────────────────────────────
  let lpdf           = null;
  let debounce       = null;
  let currentPdfDoc  = null;
  let currentPdfBytes = null;
  let zoomFactor     = 1.0;   // 1.0 = fit to pane
  const ZOOM_STEP   = 1.25;
  const ZOOM_MIN    = 0.25;
  const ZOOM_MAX    = 4.0;

  // ── Helpers ────────────────────────────────────────────────────────────────
  function setStatus(kind, msg, spinner = false) {
    statusEl.innerHTML =
      (spinner ? '<span class="spinner"></span>' : '') +
      `<span class="status-${kind}">${msg}</span>`;
  }

  function getFitScale(page) {
    const vp = page.getViewport({ scale: 1 });
    const W  = pagesEl.clientWidth  - 32;
    const H  = pagesEl.clientHeight - 32;
    return Math.min(W / vp.width, H / vp.height);
  }

  async function renderPages() {
    if (!currentPdfDoc) return;
    pagesEl.innerHTML = '';

    const firstPage = await currentPdfDoc.getPage(1);
    const fitScale  = getFitScale(firstPage);
    const scale     = fitScale * zoomFactor;

    zoomLabelEl.textContent  = `${Math.round(scale * 100)}%`;
    btnZoomIn.disabled  = zoomFactor >= ZOOM_MAX;
    btnZoomOut.disabled = zoomFactor <= ZOOM_MIN;
    btnZoomFit.disabled = false;
    btnDownload.disabled = false;

    for (let p = 1; p <= currentPdfDoc.numPages; p++) {
      const page     = p === 1 ? firstPage : await currentPdfDoc.getPage(p);
      const viewport = page.getViewport({ scale });
      const canvas   = document.createElement('canvas');
      canvas.width   = viewport.width;
      canvas.height  = viewport.height;
      pagesEl.appendChild(canvas);
      await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
    }
  }

  async function render() {
    if (!lpdf) return;
    const xml = editor.value.trim();
    if (!xml) { setStatus('idle', 'ready'); return; }

    setStatus('loading', 'rendering…', true);
    try {
      const bytes = await lpdf.renderPdf(xml);
      const byteSize = bytes.length;
      currentPdfBytes = bytes.slice();
      currentPdfDoc  = await pdfjsLib.getDocument({ data: bytes }).promise;
      zoomFactor = 1.0;
      placeholder.style.display = 'none';
      pdfSizeEl.textContent = `${(byteSize / 1024).toFixed(1)} KB`;
      await renderPages();
      setStatus('ok', `PDF ready · ${currentPdfDoc.numPages} page${currentPdfDoc.numPages > 1 ? 's' : ''}`);
    } catch (err) {
      setStatus('error', err.message);
    }
  }

  function schedule() {
    clearTimeout(debounce);
    debounce = setTimeout(render, 500);
  }

  // ── Boot ───────────────────────────────────────────────────────────────────
  const wasmUrl = new URL('../../dist/web/lpdf_bg.wasm', import.meta.url);

  try {
    lpdf = await initLpdf(wasmUrl);
    setStatus('ok', 'engine ready');
    btnRender.disabled = false;
    const res = await fetch(EXAMPLES[0].file);
    editor.value = res.ok ? await res.text() : '';
    render();
  } catch (err) {
    setStatus('error', `Engine failed to load: ${err.message}`);
  }

  editor.addEventListener('input', schedule);
  btnRender.addEventListener('click', () => { clearTimeout(debounce); render(); });

  btnZoomIn.addEventListener('click', () => {
    zoomFactor = Math.min(ZOOM_MAX, zoomFactor * ZOOM_STEP);
    renderPages();
  });
  btnZoomOut.addEventListener('click', () => {
    zoomFactor = Math.max(ZOOM_MIN, zoomFactor / ZOOM_STEP);
    renderPages();
  });
  btnZoomFit.addEventListener('click', () => {
    zoomFactor = 1.0;
    renderPages();
  });

  btnDownload.addEventListener('click', () => {
    if (!currentPdfBytes) return;
    const blob = new Blob([currentPdfBytes], { type: 'application/pdf' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href     = url;
    a.download = 'document.pdf';
    a.click();
    URL.revokeObjectURL(url);
  });
</script>

</body>
</html>
