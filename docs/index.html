<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="lpdf.io — Coming Soon" />
  <title>lpdf.io</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0d0d0d;
      color: #f0f0f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .container {
      text-align: center;
      padding: 2rem;
    }

    .logo {
      font-size: 3.5rem;
      font-weight: 800;
      letter-spacing: -0.04em;
      color: #ffffff;
      margin-bottom: 1rem;
    }

    .logo span {
      color: #5b8ef0;
    }

    .tagline {
      font-size: 1.15rem;
      color: #888;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      background: #5b8ef0;
      border-radius: 50%;
      margin: 2.5rem auto;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.4; transform: scale(0.75); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">lpdf<span>.io</span></div>
    <div class="dot"></div>
    <p class="tagline">Coming Soon</p>
  </div>
</body>
</html>
