# The counts of the core pipeline: instructions and estimated cycles under Valgrind with Gungraun
# (benches/counts.rs, fonts.rs and data.rs), and allocations with a counting allocator
# (benches/allocations.rs). The fixtures of fixtures/ are this crate's, so every build reads the same file.
#
# A workspace of its own, outside `src/core`, so that bench.yml can copy it into a checkout of an earlier
# release and measure every build of a run with the same benchmarks. The workflow copies the checkout's
# Cargo.lock in first, so that each build keeps the dependency versions it was released with.
[package]
name    = "lpdf-bench-counts"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[features]
# The checkout's lib.rs has bench_layout_doc and bench_write_pdf, which measure layout and the PDF
# write apart. scripts/bench-counts.sh turns it on where they are, since earlier releases lack them.
split-stages = []
# The checkout's lib.rs has the entry points that set embedded fonts' advances for layout and list the `src` of a
# fixture's fonts, which the `fonts` benchmarks and the `fonts` rows of `allocations` use. scripts/bench-counts.sh
# turns it on where they are.
embedded-fonts = ["split-stages"]
# The checkout reads a <markdown> and a <code>, which the fixtures `markdown` and `code` of `fixtures/` are
# made of. scripts/bench-counts.sh turns each on where the checkout's schema has the element.
markdown = []
code     = []

[dev-dependencies]
lpdf     = { path = "../../src/core" }
# The runner, gungraun-runner, must be the same version: bench.yml installs it from this line.
gungraun = "=0.20.0"

[[bench]]
name    = "counts"
harness = false

[[bench]]
name              = "fonts"
harness           = false
required-features = ["embedded-fonts"]

[[bench]]
name    = "data"
harness = false

[[bench]]
name    = "allocations"
harness = false

# Symbols for callgrind_annotate; they don't change the code measured.
[profile.bench]
debug = true
