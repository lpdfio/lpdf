name: Cut release candidate
run-name: "${{ inputs.dry_run && 'Dry run: cut' || 'Cut' }} release candidate${{ inputs.version && format(' for {0}', inputs.version) || '' }}"

# The button for `make rc-next`: Actions → Cut release candidate → Run workflow.
# It tags GitHub's main with the next vX.Y.0-rc.N, worked out by
# scripts/rc-next.sh as on the command line, then starts release.yml's RC job
# on that tag. Nothing reaches a package registry (Lpdf-devcycle.md §4.2).
#
# A tag pushed with GITHUB_TOKEN starts no workflow, so the push alone would
# start nothing. A workflow_dispatch is the exception, which is why the last
# step starts release.yml itself. release.yml then runs on the tag as if the
# tag had been pushed: the `rc` environment, whose App key only RC tags may
# use, sees the same tag either way.
#
# Two runs at once can't make the same RC: GitHub refuses a tag that already
# exists, and the run that loses changes nothing.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, only for a major bump (e.g. v1.0.0). Empty: the next minor"
        required: false
        default: ""
      dry_run:
        description: "Dry run: show what would be tagged, tag nothing"
        type: boolean
        default: false

permissions:
  contents: write   # push the tag
  actions: write    # start release.yml on it

jobs:
  cut:
    name: Cut release candidate
    runs-on: ubuntu-latest
    steps:
      # The script tags GitHub's main whatever branch this runs from, but a
      # branch's copy of this workflow and the script may differ from main's.
      - name: Check this runs from main
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          echo "::error::Run this from main, not ${GITHUB_REF#refs/heads/}."
          exit 1

      # Full history: the summary lists the commits since the last release.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # The annotated tag records who pressed the button.
      - name: Tag the next release candidate
        id: cut
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          git config user.name  "$GITHUB_ACTOR"
          git config user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"
          set -- --yes
          if [ "$DRY_RUN" = "true" ]; then set -- "$@" --dry-run; fi
          sh scripts/rc-next.sh "$@" "$VERSION" 2>&1 | tee "$RUNNER_TEMP/rc-next.txt"

      - name: Summary
        if: ${{ always() }}
        run: |
          [ -f "$RUNNER_TEMP/rc-next.txt" ] || exit 0
          {
            echo '```text'
            cat "$RUNNER_TEMP/rc-next.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Start release.yml on the tag
        if: ${{ steps.cut.outputs.tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.cut.outputs.tag }}
        run: |
          if ! gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"; then
            echo "::error::$TAG is pushed, but release.yml didn't start. Start it by hand: Actions → Release → Run workflow → Use workflow from: $TAG."
            exit 1
          fi
          echo "Started release.yml on $TAG: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/workflows/release.yml" >> "$GITHUB_STEP_SUMMARY"
