name: Release
run-name: Release ${{ github.ref_name }}

# Two kinds of tag run through this workflow (Lpdf-devcycle.md §4.2):
#
#   vX.Y.0-rc.N   Release candidate. Tests, builds, and publishes the engine as
#                 a GitHub PRE-release, then sends `core-rc` to the five SDK and
#                 extension repos. Their rc.yml builds and tests against it and
#                 publishes nothing. No approval gate, no changelog.
#
#   vX.Y.0        The real release. Refuses to run unless a vX.Y.0-rc.N tag
#                 points at the same commit (see "Require a release candidate"),
#                 then the approval gate, the GitHub Release, and `core-release`
#                 to the five repos, which publish to their registries.

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write      # required for GitHub Attestations (OIDC)
  attestations: write  # required for actions/attest-build-provenance

jobs:
  # ── 1. Tests ────────────────────────────────────────────────────────────────
  test:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A final vX.Y.0 must have had a release candidate on the same commit, so
      # nothing public is the first run of anything. Checked first, so a
      # missing RC fails in seconds — before tests, build or the approval gate.
      # It proves an RC was cut, not that its five rc.yml runs passed; check
      # those before publishing. Skipped for RC tags themselves.
      - name: Require a release candidate
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          TAG: ${{ github.ref_name }}
        run: |
          HEAD_SHA=$(git rev-parse HEAD)
          # Glob refspec: fetches every vX.Y.0-rc.N tag; matching none is not an error.
          git fetch --no-tags --depth=1 origin "+refs/tags/${TAG}-rc.*:refs/tags/${TAG}-rc.*" || true
          FOUND=""
          for t in $(git tag -l "${TAG}-rc.*"); do
            if [ "$(git rev-parse "$t^{commit}")" = "$HEAD_SHA" ]; then FOUND="$t"; fi
          done
          if [ -z "$FOUND" ]; then
            echo "::error::No release candidate for $TAG on this commit ($HEAD_SHA). Push ${TAG}-rc.1 on this commit, check the five RC runs, then release $TAG. Delete this tag and its GitHub Release first if they were created."
            exit 1
          fi
          echo "Release candidate $FOUND is on this commit."

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test core
        env:
          LPDF_PUBLIC_KEY: ${{ secrets.LPDF_PUBLIC_KEY }}
        run: cargo test --manifest-path src/core/Cargo.toml
      - name: Test wasi
        env:
          LPDF_PUBLIC_KEY: ${{ secrets.LPDF_PUBLIC_KEY }}
        run: cargo test --manifest-path src/core-wasi/Cargo.toml

  # ── 2. Build artifacts ──────────────────────────────────────────────────────
  build:
    name: Build artifacts
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,wasm32-wasip1

      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build wasm-pack (node target)
        env:
          LPDF_PUBLIC_KEY: ${{ secrets.LPDF_PUBLIC_KEY }}
        run: wasm-pack build src/core --target nodejs --out-dir ../../dist/node

      - name: Build wasm-pack (web target)
        env:
          LPDF_PUBLIC_KEY: ${{ secrets.LPDF_PUBLIC_KEY }}
        run: wasm-pack build src/core --target web --out-dir ../../dist/web

      - name: Build WASI binary
        env:
          LPDF_PUBLIC_KEY: ${{ secrets.LPDF_PUBLIC_KEY }}
        run: |
          cargo build \
            --manifest-path src/core-wasi/Cargo.toml \
            --release \
            --target wasm32-wasip1
          mkdir -p artifacts
          cp target/wasm32-wasip1/release/lpdf-wasi.wasm artifacts/
          cp dist/node/lpdf.js       artifacts/
          cp dist/node/lpdf_bg.wasm  artifacts/
          cp dist/web/lpdf.js        artifacts/lpdf-web.js

      # TODO: add when src/core-ffi is implemented
      # - name: Install cross (for aarch64 cross-compilation)
      #   uses: taiki-e/install-action@v2
      #   with:
      #     tool: cross
      # - name: Build FFI (x86_64-linux)
      #   run: |
      #     cargo build --manifest-path src/core-ffi/Cargo.toml --release \
      #       --target x86_64-unknown-linux-gnu
      #     cp target/x86_64-unknown-linux-gnu/release/liblpdf.so \
      #        artifacts/liblpdf-linux-x86_64.so
      # - name: Build FFI (aarch64-linux)
      #   run: |
      #     cross build --manifest-path src/core-ffi/Cargo.toml --release \
      #       --target aarch64-unknown-linux-gnu
      #     cp target/aarch64-unknown-linux-gnu/release/liblpdf.so \
      #        artifacts/liblpdf-linux-aarch64.so

      - name: Generate SHA256SUMS
        working-directory: artifacts
        run: sha256sum lpdf-wasi.wasm lpdf.js lpdf_bg.wasm lpdf-web.js > SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: artifacts/

  # ── 3a. Release candidate: pre-release + dispatch core-rc ───────────────────
  # Runs for vX.Y.0-rc.N only. Nothing here reaches a package registry: the
  # pre-release is never GitHub's "latest" (which the SDKs' ci.yml fallbacks
  # read), and the five repos answer `core-rc` with build + test only.
  rc:
    name: Publish release candidate
    needs: build
    if: ${{ contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag is vX.Y.0-rc.N
        run: |
          if ! echo "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.0-rc\.[0-9]+$'; then
            echo "::error::'$TAG' is not a release-candidate tag. Use vX.Y.0-rc.N, e.g. v0.17.0-rc.1."
            exit 1
          fi

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: artifacts/

      # A pushed tag has no release yet; one created in the Releases UI does.
      # Either way it ends up a pre-release, even if the UI checkbox was missed.
      - name: Create pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FINAL="${TAG%-rc.*}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --prerelease --draft=false
          else
            gh release create "$TAG" \
              --prerelease \
              --title "$TAG" \
              --notes "Release candidate for $FINAL. Nothing from it is published to a package registry."
          fi

      # --clobber: re-running the job replaces the assets instead of failing.
      - name: Upload release artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$TAG" \
            artifacts/lpdf-wasi.wasm \
            artifacts/lpdf.js \
            artifacts/lpdf_bg.wasm \
            artifacts/lpdf-web.js \
            artifacts/SHA256SUMS \
            --clobber

      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.LPDF_RELEASE_APP_ID }}
          private-key: ${{ secrets.LPDF_RELEASE_APP_PRIVATE_KEY }}
          repositories: lpdf-js,lpdf-dotnet,lpdf-python,lpdf-vscode,lpdf-php,lpdf-api

      # `core-rc`, not `core-release`: only each repo's rc.yml listens to it.
      #
      # lpdf-api is not an adapter: it is the private repo holding the engine's Lambda, and its
      # rc.yml deploys this RC to lpdf-api-pre rather than building a package. It listens for the
      # same event, so it belongs on the same list.
      - name: Dispatch core-rc to adapter repos
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          for repo in lpdf-js lpdf-dotnet lpdf-python lpdf-php lpdf-vscode lpdf-api; do
            gh api "repos/lpdfio/$repo/dispatches" \
              --method POST \
              -f event_type=core-rc \
              -f "client_payload[version]=$TAG"
          done

      - name: Summary
        run: |
          {
            echo "### Release candidate $TAG"
            echo
            echo "Check all six runs, and install the extension's .vsix by hand. Then release ${TAG%-rc.*} from this commit."
            echo
            for repo in lpdf-js lpdf-dotnet lpdf-python lpdf-php lpdf-vscode lpdf-api; do
              echo "- [$repo](https://github.com/lpdfio/$repo/actions/workflows/rc.yml)"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  # ── 3b. Publish GitHub Release + dispatch to adapters ───────────────────────
  # Final vX.Y.0 only. RC tags take job 3a instead.
  release:
    name: Publish release
    needs: build
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    environment: release   # optional manual-approval gate — remove if not needed
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: artifacts/

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            artifacts/lpdf-wasi.wasm
            artifacts/lpdf.js
            artifacts/lpdf_bg.wasm
            artifacts/lpdf-web.js

      # Only create a release when the tag doesn't already have one. GitHub does
      # NOT enforce one release per tag for DRAFTS — an unguarded
      # `gh release create --draft` on a tag you already published through the
      # Releases UI silently creates a second, draft release object beside it,
      # carrying --generate-notes text instead of your own. That is what
      # happened on v0.14.0.
      #
      # So this path is only for a bare `git push origin vX.Y.0` with no release
      # behind it; there, --generate-notes is the right default.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "Release ${{ github.ref_name }} already exists — leaving its notes alone"
            exit 0
          fi
          gh release create "${{ github.ref_name }}" \
            --draft \
            --title "${{ github.ref_name }}" \
            --generate-notes

      - name: Upload release artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            artifacts/lpdf-wasi.wasm \
            artifacts/lpdf.js \
            artifacts/lpdf_bg.wasm \
            artifacts/lpdf-web.js \
            artifacts/SHA256SUMS

      - name: Publish release (draft → live)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --draft=false

      # Mint a short-lived GitHub App token for all adapter dispatches.
      # Sending a repository_dispatch needs Contents:write on each adapter
      # repo. The adapters push with their own GITHUB_TOKEN, never this one:
      # it is revoked when this job ends, before any of them gets to push.
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.LPDF_RELEASE_APP_ID }}
          private-key: ${{ secrets.LPDF_RELEASE_APP_PRIVATE_KEY }}
          repositories: lpdf-js,lpdf-dotnet,lpdf-python,lpdf-vscode,lpdf-php

      - name: Dispatch to adapter repos
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          for repo in lpdf-js lpdf-dotnet lpdf-python lpdf-php lpdf-vscode; do
            gh api "repos/lpdfio/$repo/dispatches" \
              --method POST \
              -f event_type=core-release \
              -f "client_payload[version]=$VERSION"
          done

      # ── Changelog ───────────────────────────────────────────────────────────
      # Prepends this release's human-typed notes to CHANGELOG.md on main.
      #
      # Runs LAST, after the adapter dispatch, so a failure here cannot block
      # the cascade — the release has already shipped and the adapters have
      # already been told.
      #
      # It DOES fail the job on error, deliberately: this path is unproven, and
      # a step that warns-and-passes on its first ever run is undiagnosable.
      # Once a full core release has exercised it end to end, relax it to
      # warn-only per changelog-plan.md ("Failure policy").
      - name: Update CHANGELOG.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # The release body is whatever a human typed when publishing.
          BODY=$(gh release view "$TAG" --json body        -q .body        | tr -d '\r')
          DATE=$(gh release view "$TAG" --json publishedAt -q .publishedAt | cut -c1-10)
          if [ -z "$DATE" ]; then
            echo "::error::$TAG has no publishedAt — is the release still a draft?"
            exit 1
          fi

          # The job checked out the tag (detached). Move to main's tip so the
          # changelog commit lands on the branch regardless of where the tag is.
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch --depth=1 origin main
          git checkout -B main FETCH_HEAD

          if ! head -n 1 CHANGELOG.md | grep -qx '# Changelog'; then
            echo "::error::CHANGELOG.md must start with a '# Changelog' line"
            exit 1
          fi

          # Re-runs must not duplicate an entry.
          if grep -q "^## $TAG " CHANGELOG.md; then
            echo "$TAG is already in CHANGELOG.md — nothing to do"
            exit 0
          fi

          # Prepend only. Never reformat or reorder what is already there —
          # the file is hand-editable by design.
          {
            echo "# Changelog"
            echo
            echo "## $TAG — $DATE"
            if [ -n "$BODY" ]; then printf '%s\n' "$BODY"; fi
            tail -n +2 CHANGELOG.md
          } > CHANGELOG.next
          mv CHANGELOG.next CHANGELOG.md

          git add CHANGELOG.md
          git diff --cached --quiet || git commit -m "changelog: $TAG"
          git push origin main
