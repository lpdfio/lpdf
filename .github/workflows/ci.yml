name: CI
run-name: "${{ format('CI (build + test): {0}', github.event_name == 'pull_request' && github.event.pull_request.title || github.event.head_commit.message) }}"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Rust tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test core
        env:
          LPDF_PUBLIC_KEY: ${{ secrets.LPDF_PUBLIC_KEY }}
        run: cargo test --manifest-path src/core/Cargo.toml

      - name: Test wasi
        env:
          LPDF_PUBLIC_KEY: ${{ secrets.LPDF_PUBLIC_KEY }}
        run: cargo test --manifest-path src/core-wasi/Cargo.toml

      - name: Test cli
        env:
          LPDF_PUBLIC_KEY: ${{ secrets.LPDF_PUBLIC_KEY }}
        run: cargo test --manifest-path src/cli/Cargo.toml

      - name: Check encrypted PDFs with qpdf
        env:
          LPDF_PUBLIC_KEY: ${{ secrets.LPDF_PUBLIC_KEY }}
        run: |
          sudo apt-get install -y qpdf
          make check-encryption

      - name: Check PDF/A files with veraPDF and qpdf
        env:
          LPDF_PUBLIC_KEY: ${{ secrets.LPDF_PUBLIC_KEY }}
        run: make check-pdfa
