name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Check LICENSE copies are in sync
        run: make check-license

      - name: Test core
        env:
          LPDF_PUBLIC_KEY: ${{ secrets.LPDF_PUBLIC_KEY }}
        run: cargo test --manifest-path src/core/Cargo.toml

      - name: Test wasi
        env:
          LPDF_PUBLIC_KEY: ${{ secrets.LPDF_PUBLIC_KEY }}
        run: cargo test --manifest-path src/core-wasi/Cargo.toml
