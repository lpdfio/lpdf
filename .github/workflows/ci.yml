name: CI
run-name: "${{ format('CI (build + test): {0}', github.event_name == 'pull_request' && github.event.pull_request.title || github.event.head_commit.message) }}"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Rust tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # wasm32-wasip1 for the WASI build, whose function sizes are checked below.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - uses: Swatinem/rust-cache@v2

      # The core's table of attributes and their types is generated from the schema: a schema change that isn't
      # regenerated fails here. The SDKs' generated files are checked in each SDK's own CI.
      - name: Check the attribute table against the schema
        run: node scripts/gen-sdk-api.mjs --check --core

      # The check each SDK's CI runs on the code codegen writes (scripts/check-codegen-sdk.mjs) lives here, with the
      # corpus it renders (test/codegen-corpus.json, which `cargo test` below keeps current). Core runs no SDK.
      - name: Test the codegen check's scripts
        run: node --test scripts/check-codegen-sdk.test.mjs

      - name: Test core
        env:
          LPDF_PUBLIC_KEY: ${{ secrets.LPDF_PUBLIC_KEY }}
        run: cargo test --manifest-path src/core/Cargo.toml

      - name: Test wasi
        env:
          LPDF_PUBLIC_KEY: ${{ secrets.LPDF_PUBLIC_KEY }}
        run: cargo test --manifest-path src/core-wasi/Cargo.toml

      - name: Test the native library
        env:
          LPDF_PUBLIC_KEY: ${{ secrets.LPDF_PUBLIC_KEY }}
        run: cargo test --manifest-path src/core-ffi/Cargo.toml

      - name: Test cli
        env:
          LPDF_PUBLIC_KEY: ${{ secrets.LPDF_PUBLIC_KEY }}
        run: cargo test --manifest-path src/cli/Cargo.toml

      # The Java SDK compiles each function of the WASI build to one JVM method, which holds at most 64 KB of bytecode:
      # a function over 40 KB of WASM fails here, in the PR that grew it, rather than when an RC reaches the SDK.
      - name: Check the size of the engine's functions
        env:
          LPDF_PUBLIC_KEY: ${{ secrets.LPDF_PUBLIC_KEY }}
        run: make check-function-sizes

      - name: Check encrypted PDFs with qpdf
        env:
          LPDF_PUBLIC_KEY: ${{ secrets.LPDF_PUBLIC_KEY }}
        run: |
          sudo apt-get install -y qpdf
          make check-encryption

      - name: Check linearized PDFs with qpdf
        env:
          LPDF_PUBLIC_KEY: ${{ secrets.LPDF_PUBLIC_KEY }}
        run: make check-linearization

      - name: Check the files a PDF carries with qpdf
        env:
          LPDF_PUBLIC_KEY: ${{ secrets.LPDF_PUBLIC_KEY }}
        run: make check-attachments

      - name: Check PDF/A files with veraPDF and qpdf
        env:
          LPDF_PUBLIC_KEY: ${{ secrets.LPDF_PUBLIC_KEY }}
        run: make check-pdfa

      - name: Check PDF/UA files with veraPDF and qpdf
        env:
          LPDF_PUBLIC_KEY: ${{ secrets.LPDF_PUBLIC_KEY }}
        run: make check-pdfua

      - name: Check the PDF/X file with qpdf
        env:
          LPDF_PUBLIC_KEY: ${{ secrets.LPDF_PUBLIC_KEY }}
        run: make check-pdfx

      - name: Check the plates of spot colors with Ghostscript
        env:
          LPDF_PUBLIC_KEY: ${{ secrets.LPDF_PUBLIC_KEY }}
        run: make check-spot

      # Java 17, the runner's default, runs the Mustang CLI, which needs 11 or later.
      - name: Check Factur-X invoices with the Mustang CLI
        env:
          LPDF_PUBLIC_KEY: ${{ secrets.LPDF_PUBLIC_KEY }}
        run: make check-facturx

      - name: Check optional content with pdf.js
        env:
          LPDF_PUBLIC_KEY: ${{ secrets.LPDF_PUBLIC_KEY }}
        run: make check-ocg

  # The native library the PHP SDK loads through FFI, built as the release builds it: for glibc 2.17 on x86_64 and
  # aarch64, and refused when either needs a newer glibc (scripts/build-ffi.sh). The release attaches the same files.
  ffi:
    name: Build the native library
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2

      # zig cross-compiles both targets against the glibc 2.17 symbols; pinned, as in scripts/build-ffi.Dockerfile.
      - name: Install cargo-zigbuild and zig
        run: |
          python3 -m venv "$RUNNER_TEMP/zig"
          "$RUNNER_TEMP/zig/bin/pip" install --quiet ziglang==0.17.0 cargo-zigbuild==0.24.0
          echo "$RUNNER_TEMP/zig/bin" >> "$GITHUB_PATH"

      - name: Build for glibc 2.17 and check the glibc each needs
        env:
          LPDF_PUBLIC_KEY: ${{ secrets.LPDF_PUBLIC_KEY }}
        run: sh scripts/build-ffi.sh dist/ffi

      - uses: actions/upload-artifact@v6
        with:
          name: native-libraries
          path: dist/ffi/
