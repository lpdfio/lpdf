name: Create release tag

# Method B from LPDF-repo.md — creates the tag that triggers release.yml.
# Method A: create the tag manually from the GitHub Releases UI.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.3.0) — core releases are always MAJOR.MINOR.0'
        required: true
        type: string

jobs:
  create-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Validate version format
        run: |
          if ! echo "${{ inputs.version }}" | grep -qE '^v[0-9]+\.[0-9]+\.0$'; then
            echo "Error: version must match vMAJOR.MINOR.0 — core patch is always 0"
            exit 1
          fi

      - name: Create and push tag
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ inputs.version }}"
          git push origin "${{ inputs.version }}"
